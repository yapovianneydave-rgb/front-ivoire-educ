<section class="login-page">
  <div class="overlay d-flex justify-content-center align-items-center w-100 min-vh-100">

    <!-- Carte de connexion SOMBRE (Premium & Graphique) -->
    <div class="login-card p-4 p-md-5 mx-3 w-100" style="max-width: 450px;">

      <!-- LOGO (IvoireEduc parfaitement fondu dans le noir) -->
      <div class="logo-container text-center">
        <img
          src="assets/images/IvoireEduc_Elite_logo_v4.jpg"
          alt="Logo IvoireEduc Elite"
          class="login-logo"
        />
      </div>

      <!-- MESSAGE -->
      <p class="login-desc text-center mb-4">
        Entrez votre identifiant et votre mot de passe pour accéder à votre application.
      </p>

      <!-- SÉPARATEUR DE MARQUE -->
      <div class="login-separator">
        IVOIRE EDUC ELITE
      </div>

      <!-- FORMULAIRE -->
      <form (ngSubmit)="onLogin()">

        <!-- Champ Identifiant -->
        <div class="login-input-group mb-3">
          <input
            type="text"
            placeholder="Identifiant"
            [(ngModel)]="identifiant"
            name="identifiant"
            autocomplete="username"
            required
          />
          <span class="input-icon">
            <i class="bi bi-envelope-fill"></i>
          </span>
        </div>

        <!-- Champ Mot de passe -->
        <div class="login-input-group mb-4">
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Mot de passe"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <span class="input-icon" (click)="togglePassword()" style="cursor: pointer;">
            <i [class]="showPassword ? 'bi bi-unlock-fill' : 'bi bi-lock-fill'"></i>
          </span>
        </div>

        <!-- Bouton Connexion (Dégradé Orange) -->
        <div class="text-center d-grid gap-2">
          <button type="submit" class="btn btn-login w-100 py-2">
            Connexion
          </button>
        </div>

        <!-- Lien de redirection vers l'inscription -->
        <div class="text-center mt-4 login-footer-text">
          <span>Vous n'avez pas de compte ? </span>
          <a routerLink="/auth/register" class="link-register">Inscrivez-vous</a>
        </div>

      </form>

      <!-- Copyright -->
      <div class="text-center mt-4 pt-2">
        <p class="copyright-text mb-0">© 2026 Structure Ivoire Educ Elite</p>
      </div>

    </div>
  </div>
</section>
